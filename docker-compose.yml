services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init-worker
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama-local:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen2.5:3b"]
    restart: "no"

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp-server-1
    ports:
      - "5000:5000"
    environment:
      - BACKEND_HOST=http://fastapi-app-1:8000
    restart: unless-stopped

  fastapi-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-app-1
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama-local:11434
      - BACKEND_HOST=http://localhost:8000
      - LOG_LEVEL=INFO
      - DEBUG=false
    depends_on:
      ollama:
        condition: service_started
      mcp-server:
        condition: service_started
    restart: unless-stopped

  streamlit-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamlit-ui-1
    ports:
      - "8501:8501"
    environment:
      - BACKEND_HOST=http://fastapi-app-1:8000
    depends_on:
      fastapi-app:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_models: